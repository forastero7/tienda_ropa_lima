name: CI

on:
  push:
    branches: [claude/new-session-hbu6rn, main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: tienda
          POSTGRES_PASSWORD: tienda
          POSTGRES_DB: tienda_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U tienda" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://tienda:tienda@localhost:5432/tienda_test
      TEST_DATABASE_URL: postgresql://tienda:tienda@localhost:5432/tienda_test
      ADMIN_SESSION_SECRET: ci-secret-ci-secret-ci-secret-ci-secret
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      # El build prerenderiza páginas que leen el catálogo.
      - run: npx tsx prisma/seed.ts
      - run: npm run build
